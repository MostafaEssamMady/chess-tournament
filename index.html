  <script>// حارس الإطارات (frame-buster): يمنع عرض الموقع داخل إطار في صفحة أخرى (هجوم النقر المخادع Clickjacking).
// الاستضافات التي لا تسمح بترويسات HTTP (مثل GitHub Pages) لا تستطيع إرسال frame-ancestors،
// فنفعل ذلك هنا: إن كنا داخل إطار نُخفي الصفحة كليًا ونحاول الخروج منه. (لا يؤثر في فتح الموقع عادة.)
(function () {
  'use strict';
  try {
    if (window.top === window.self) return;
  } catch (e) { /* الوصول إلى top ممنوع = نحن داخل إطار من أصل آخر */ }
  window.CT_FRAMED = true;
  document.documentElement.style.display = 'none';
  try { window.top.location.replace(window.self.location.href); } catch (e) { /* إطار محمي بـ sandbox: تبقى الصفحة مخفية */ }
})();
</script>

  <style>/* ============================================================
   Chess — الأنماط
   ثيم أسود خالص بشكل لوحة بطولات إسبورتس: خلفية #000، بطاقات #1e293b، تأكيد أزرق #2563eb، «مباشر» أخضر #22c55e.
   خطوط النظام فقط، فلا شيء يُحمَّل من طرف ثالث. كل الأبعاد خصائص منطقية (inline-start/end) فينقلب الشكل بين RTL وLTR وحده.
   ============================================================ */

:root {
  --paper: #000;
  --surface: #1e293b;
  --surface-2: #0f1623;
  --ink: #f4f6fa;
  --ink-2: #aab6c8;
  --line: #2a3547;
  --line-strong: #3f4d63;
  --sq-dark: #b58863;
  --sq-light: #f0d9b5;
  --link: #7db4ff;
  --focus: #93c5fd;
  --accent: #2563eb;
  --accent-ink: #fff;
  --live: #22c55e;
  --live-ink: #04210f;
  --btn-bg: #2563eb;
  --btn-fg: #fff;
  --win: #4ade80;
  --danger: #f87171;
  --danger-fg: #1b0907;
  --ok-bg: #0f2f22;
  --ok-ink: #9be6bd;
  --amber-bg: #3d3010;
  --amber-ink: #ffdc94;
  --amber-line: #8a6a22;
  --gold: #facc15;
  --silver: #cbd5e1;
  --bronze: #e0944a;
  --gold-bg: #6b5513;
  --silver-bg: #334155;
  --piece-white-bg: #f4f6fa;
  --piece-white-bd: #f4f6fa;
  --piece-black-bg: #05080d;
  --piece-black-bd: #8fa3bf;
  --radius: 8px;
  --nav-h: 4.6rem;
  --font: "Segoe UI", "Noto Sans Arabic", "Noto Kufi Arabic", Tahoma, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.75;
}

h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--link); text-underline-offset: 0.2em; }
button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.main:focus { outline: none; }
[hidden] { display: none !important; }

.ltr { direction: ltr; unicode-bidi: isolate; }
.ltr-inline { direction: ltr; unicode-bidi: isolate; text-align: right; }
input.ltr, textarea.ltr { text-align: left; }
.hp { position: absolute; inset-inline-start: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.skip { position: absolute; inset-inline-start: 0.5rem; top: -4rem; background: var(--btn-bg); color: var(--btn-fg); padding: 0.6rem 1rem; border-radius: var(--radius); z-index: 50; }
.skip:focus { top: 0.5rem; }

/* ---------- الهيكل ---------- */

.top {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.85rem max(1rem, calc((100% - 52rem) / 2)) 0.5rem;
  background: var(--paper);
}
.brand { display: inline-flex; align-items: center; gap: 0.7rem; min-height: 2.75rem; color: var(--ink); text-decoration: none; }
.brand-en { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.01em; line-height: 1; font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
.brand-sep { width: 1px; height: 1.5rem; background: var(--line-strong); }
.brand-ar { font-size: 1.35rem; font-weight: 500; line-height: 1; }
.top-tools { display: flex; align-items: center; gap: 0.5rem; }
.top-nav { display: flex; gap: 0.25rem; align-items: center; }
.lang-toggle { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line-strong); background: #0a0a0a; direction: ltr; }
.lang-btn { min-width: 2.7rem; min-height: 2.2rem; padding: 0 0.7rem; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--ink-2); font-weight: 700; font-size: 0.95rem; cursor: pointer; }
.lang-btn[aria-pressed="true"] { color: #fff; border-color: #fff; }
.icon-btn { display: inline-grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 50%; color: var(--ink); text-decoration: none; }
.icon-btn:hover { background: var(--surface); }
.nav-link { display: inline-flex; align-items: center; min-height: 2.75rem; color: var(--ink-2); text-decoration: none; padding: 0.45rem 0.8rem; border-radius: var(--radius); font-weight: 600; font-size: 0.9375rem; }

.main { max-width: 52rem; margin-inline: auto; padding: 1.25rem 1rem 2rem; min-height: 60vh; }
.foot { max-width: 52rem; margin-inline: auto; padding: 1.5rem 1rem calc(var(--nav-h) + 2rem + env(safe-area-inset-bottom)); color: var(--ink-2); font-size: 0.875rem; border-top: 1px solid var(--line); }


/* ---------- الطباعة والعناوين ---------- */

.title { font-size: clamp(1.6rem, 4.5vw, 2.25rem); line-height: 1.3; font-weight: 800; letter-spacing: 0; }
.hero { padding: 0.5rem 0 1.75rem; }
.hero-title { font-size: clamp(2rem, 7vw, 3.1rem); line-height: 1.2; font-weight: 800; }
.hero .lede { margin-top: 0.9rem; }
.lede { color: var(--ink-2); font-size: 1.0625rem; max-width: 38rem; }
.section { margin-top: 2.5rem; }
.section h2 { font-size: 1.25rem; font-weight: 800; line-height: 1.4; margin-bottom: 0.75rem; }
.section h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 0.5rem; }
.section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.75rem; }
.section-head h2 { margin: 0; }
.hint { color: var(--ink-2); font-size: 0.875rem; line-height: 1.6; }
.link { font-weight: 600; display: inline-flex; align-items: center; min-height: 2.5rem; }
.crumb { margin-bottom: 0.1rem; font-size: 0.9rem; }
.loading { color: var(--ink-2); padding: 2rem 0; }
.round-title { font-size: 0.95rem; font-weight: 700; color: var(--ink-2); margin: 1.25rem 0 0.35rem; }

/* ---------- رأس البطولة ---------- */

.masthead { padding-bottom: 0.5rem; }
.masthead-top { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem; }
.facts { display: flex; flex-wrap: wrap; margin-top: 1rem; }
.fact { padding-inline: 1.25rem; border-inline-start: 1px solid var(--line-strong); }
.fact:first-child { padding-inline-start: 0; border-inline-start: 0; }
.fact dt { font-size: 0.8125rem; color: var(--ink-2); line-height: 1.5; }
.fact dd { font-weight: 700; font-size: 1.02rem; }

.chip { display: inline-flex; align-items: center; padding: 0.1rem 0.7rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 700; line-height: 1.7; background: var(--line); color: var(--ink-2); white-space: nowrap; }
.chip-ok { background: var(--ok-bg); color: var(--ok-ink); }
.chip-amber { background: var(--amber-bg); color: var(--amber-ink); }
.chip-gold { background: var(--gold-bg); color: var(--amber-ink); }
.chip-silver { background: var(--silver-bg); color: var(--ink); }

.tabs { display: flex; gap: 0.25rem; margin-top: 1.5rem; border-bottom: 1px solid var(--line-strong); overflow-x: auto; scrollbar-width: thin; }
.tab { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; color: var(--ink-2); text-decoration: none; padding: 0.5rem 1rem; font-weight: 600; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px; }
button.tab { background: none; border-width: 0 0 3px; border-style: solid; border-color: transparent; font: inherit; font-weight: 600; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 800; border-bottom-color: var(--ink); }
.tabs + * { margin-top: 1.75rem; }
.tabs + .section { margin-top: 1.75rem; }
.player-page { margin-top: 1.75rem; }

.pills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
.pill { min-width: 2.75rem; min-height: 2.5rem; padding: 0.3rem 0.8rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.pill[aria-current="page"] { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }

/* ---------- قائمة البطولات ---------- */

.t-list { border-top: 1px solid var(--line-strong); }
.t-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 0.5rem; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.t-row:hover { background: var(--surface); }
.t-name { font-size: 1.15rem; font-weight: 800; line-height: 1.5; }
.t-meta { display: flex; flex-wrap: wrap; gap: 0 1.25rem; color: var(--ink-2); font-size: 0.875rem; }

/* ---------- صفوف المباريات: العنصر المميز ---------- */

.games { border-top: 1px solid var(--line-strong); background: var(--surface); }
.game {
  display: grid;
  grid-template-columns: 4.5rem minmax(0, 1fr) 6.5rem minmax(0, 1fr);
  align-items: center;
  column-gap: 0.75rem;
  padding: 0.7rem 0.75rem;
  border-bottom: 1px solid var(--line);
}
.gno { font-size: 0.8125rem; color: var(--ink-2); }
.side { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
.side .player-link, .side > span:not(.piece):not(.me-tag) { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side > span:not(.piece):not(.me-tag) { line-height: 2.5rem; }
.side .player-link { min-width: 2.75rem; }
.player-link { display: inline-block; min-width: 2.75rem; line-height: 2.5rem; vertical-align: middle; color: inherit; text-decoration: none; }
.player-link:hover { text-decoration: underline; }
.side.is-winner .player-link { font-weight: 800; }
.side.is-me .player-link { font-weight: 800; }
.me-tag { font-size: 0.75rem; font-weight: 800; background: var(--btn-bg); color: var(--btn-fg); border-radius: 4px; padding: 0 0.4rem; line-height: 1.5; }
.piece { flex: none; width: 0.85rem; height: 0.85rem; border-radius: 2px; border: 1.5px solid; }
.piece-white { background: var(--piece-white-bg); border-color: var(--piece-white-bd); }
.piece-black { background: var(--piece-black-bg); border-color: var(--piece-black-bd); }
.score { display: flex; align-items: center; justify-content: center; gap: 0.4rem; font-size: 1.6rem; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
.score .n { min-width: 1.1ch; text-align: center; }
.score .dash { font-weight: 400; color: var(--ink-2); }
.score-text { font-size: 0.875rem; font-weight: 600; color: var(--ink-2); text-align: center; }
.game-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; font-size: 0.8125rem; padding-top: 0.35rem; }
.meta-note { color: var(--ink-2); font-size: 0.8125rem; }
.meta-link { font-weight: 600; display: inline-flex; align-items: center; min-height: 2.5rem; }
.games.compact .game { padding-block: 0.5rem; }
.game-admin { grid-column: 1 / -1; display: grid; grid-template-columns: 12rem auto; gap: 0.5rem 0.75rem; align-items: center; padding-top: 0.6rem; margin-top: 0.4rem; border-top: 1px dashed var(--line-strong); }
.game-more { grid-column: 1 / -1; }
.game-more summary { cursor: pointer; padding: 0.6rem 0; font-size: 0.875rem; font-weight: 600; color: var(--ink-2); }
.game-more-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 0.75rem; }

@media (max-width: 36rem) {
  .game { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "board board" "white score" "black score" "meta meta" "admin admin"; row-gap: 0.15rem; }
  .game > .gno { grid-area: board; }
  .game > .side-white { grid-area: white; }
  .game > .side-black, .game > .side-empty { grid-area: black; }
  .game > .score { grid-area: score; grid-row: 2 / span 2; padding-inline-start: 0.75rem; min-width: 4.5rem; }
  .game > .game-meta { grid-area: meta; }
  .game > .game-admin { grid-area: admin; grid-template-columns: 1fr; }
  .game-more-body { grid-template-columns: 1fr; }
}

/* ---------- الترتيب واللاعبون ---------- */

.table-wrap { overflow-x: auto; background: var(--surface); border-top: 1px solid var(--line-strong); }
.table { width: 100%; border-collapse: collapse; min-width: 20rem; }
.table th { text-align: start; font-size: 0.8125rem; font-weight: 700; color: var(--ink-2); padding: 0.6rem 0.6rem; border-bottom: 1px solid var(--line-strong); }
.table td { padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.table .c-rank { width: 2.5rem; color: var(--ink-2); }
.table td.c-pts { font-weight: 800; font-size: 1.1rem; }
.table td.c-pts, .table td.c-opt, .table td.c-rank { direction: ltr; unicode-bidi: isolate; text-align: center; }
.table th.c-pts, .table th.c-opt, .table th.c-rank { text-align: center; }
.table-wrap + .hint { margin-top: 0.75rem; }
.table tr.is-me td { background: var(--amber-bg); color: var(--amber-ink); }
.table tr.is-out .player-link { color: var(--ink-2); }
.table .meta-note { margin-inline-start: 0.5rem; }

.players { background: var(--surface); border-top: 1px solid var(--line-strong); }
.player { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.9rem; padding: 0.3rem 0.75rem; border-bottom: 1px solid var(--line); }
.player .idx { color: var(--ink-2); min-width: 1.75rem; font-variant-numeric: tabular-nums; }
.player .name { font-weight: 700; }
.player .handle { margin-inline-start: auto; color: var(--ink-2); font-size: 0.9rem; }
.handle { display: inline-flex; align-items: center; min-height: 2.5rem; }
.player.is-out .name { color: var(--ink-2); text-decoration: line-through; }

.ko-list { background: var(--surface); border-top: 1px solid var(--line-strong); }
.ko-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.3rem 0.75rem; border-bottom: 1px solid var(--line); font-weight: 700; }
.ko-row.is-me { background: var(--amber-bg); color: var(--amber-ink); }

/* ---------- صفحة اللاعب ---------- */

.me-name { font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 800; line-height: 1.3; }
.me-handle { color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.15rem; }
.me-handle a { display: inline-flex; align-items: center; min-height: 2.5rem; }
.me-summary { display: flex; flex-wrap: wrap; gap: 0.75rem 2rem; margin-top: 1rem; }
.stat { display: flex; flex-direction: column; line-height: 1.2; }
.stat-n { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; text-align: start; }
.stat-l { font-size: 0.8125rem; color: var(--ink-2); }
.next { margin-top: 1.5rem; padding: 1.1rem 1.25rem; border-radius: var(--radius); background: var(--amber-bg); color: var(--amber-ink); border: 1px solid var(--amber-line); }
.next h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 0.4rem; }
.next .hint { color: inherit; opacity: 0.85; margin: 0.4rem 0 0.9rem; }
.next .btn { margin-top: 0.25rem; }
.next.quiet { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }

/* ---------- نماذج وأزرار ---------- */

.form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.1rem; max-width: 30rem; }
.form.narrow { max-width: 24rem; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.35rem; min-width: 0; }
.label { font-weight: 700; display: block; }
.input { width: 100%; min-height: 2.75rem; padding: 0.55rem 0.8rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); }
.input[aria-invalid="true"] { border-color: var(--danger); }
textarea.input { min-height: 5rem; resize: vertical; line-height: 1.6; }
.narrow-input { max-width: 8rem; }
.code { letter-spacing: 0.12em; font-weight: 700; }
.field-error { color: var(--danger); font-weight: 700; font-size: 0.875rem; }
.field-error:empty { display: none; }
.form-status { min-height: 1.5rem; color: var(--ink-2); font-size: 0.9rem; font-weight: 600; }
.form-status:empty { display: none; }

fieldset.field { border: 0; padding: 0; margin: 0; min-width: 0; }
.segmented { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.seg { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0.3rem 1.1rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-weight: 700; }
.seg input:checked + span { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

.check { display: inline-flex; align-items: center; gap: 0.6rem; min-height: 2.5rem; cursor: pointer; }
.check input { width: 1.35rem; height: 1.35rem; flex: none; accent-color: var(--btn-bg); }
.check.small { font-size: 0.875rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 2.75rem; padding: 0.45rem 1.15rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; cursor: pointer; line-height: 1.4; }
.btn:hover { border-color: var(--ink); }
.btn-primary { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: var(--danger-fg); }
.btn-small { min-height: 2.5rem; padding: 0.2rem 0.9rem; font-size: 0.875rem; }
.btn-wide { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.row-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

.copy-row { display: flex; gap: 0.5rem; }
.copy-row .input { flex: 1; min-width: 0; }
.code-chip { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 0.1rem 0.7rem; letter-spacing: 0.15em; }

.done { border: 1px solid var(--ok-ink); background: var(--ok-bg); color: var(--ok-ink); border-radius: var(--radius); padding: 1.1rem 1.25rem; max-width: 30rem; display: grid; gap: 0.6rem; }
.done-title { font-weight: 800; font-size: 1.1rem; }
.done .btn { justify-self: start; }

.steps { list-style: decimal; padding-inline-start: 1.4rem; display: grid; gap: 0.4rem; max-width: 38rem; }
.steps li::marker { font-weight: 800; color: var(--ink-2); }

.empty { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 2rem 1.25rem; text-align: center; background: var(--surface); }
.empty-title { font-weight: 800; }
.empty-hint { color: var(--ink-2); font-size: 0.9375rem; margin-top: 0.25rem; }
.empty-actions { margin-top: 1rem; display: flex; justify-content: center; gap: 0.5rem; }

.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem; padding: 0.75rem 1rem; background: var(--ok-bg); color: var(--ok-ink); border-radius: var(--radius); margin-bottom: 1rem; font-weight: 700; }
.warnings { background: var(--amber-bg); color: var(--amber-ink); border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 1rem; display: grid; gap: 0.3rem; font-size: 0.9rem; }

/* ---------- لوحة المنظّم ---------- */

.admin-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
.rows { background: var(--surface); border-top: 1px solid var(--line-strong); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem 1rem; padding: 0.7rem 0.75rem; border-bottom: 1px solid var(--line); }
.row-main { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.9rem; min-width: 0; }
.row .handle { color: var(--ink-2); font-size: 0.9rem; }
.row.is-out strong { color: var(--ink-2); text-decoration: line-through; }
.invite { margin-top: 0.5rem; display: grid; gap: 0.6rem; }
.add-player { margin-top: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.6rem 1rem; }
.add-player summary { cursor: pointer; font-weight: 700; padding: 0.6rem 0; }
.inline-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.75rem; align-items: end; margin-top: 0.75rem; }
.danger-zone { border-top: 1px solid var(--line-strong); padding-top: 1.5rem; }

/* ---------- إدارة البطولة: أقسام، الخطوة التالية، الحالة ---------- */

.admin-tabs { margin-top: 1.25rem; }
.admin-tabs .tab { flex: 1 1 auto; padding-inline: 0.6rem; }
.tab-body > :first-child, .tab-body > .section:first-child { margin-top: 0; }
.tabs + .tab-body { margin-top: 1.5rem; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 1.4rem; height: 1.4rem; padding-inline: 0.35rem; margin-inline-start: 0.4rem; border-radius: 999px; background: var(--amber-bg); color: var(--amber-ink); border: 1px solid var(--amber-line); font-size: 0.75rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }

.next-step { display: grid; justify-items: start; gap: 0.3rem; padding: 1.1rem 1.25rem; background: var(--surface); border: 1px solid var(--line-strong); border-inline-start: 5px solid var(--btn-bg); border-radius: var(--radius); }
.next-kicker { font-size: 0.8125rem; font-weight: 700; color: var(--ink-2); line-height: 1.5; }
.next-title { font-size: 1.2rem; font-weight: 800; line-height: 1.45; }
.next-text { color: var(--ink-2); }
.next-step .btn { margin-top: 0.6rem; }

.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; margin-bottom: 1.5rem; }
.stat-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; padding: 0.8rem 0.4rem; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); line-height: 1.3; }
.stat-card .stat-n { font-size: 1.5rem; text-align: center; }
.stat-card .stat-l { font-size: 0.8125rem; color: var(--ink-2); }

.ctrls { border-top: 1px solid var(--line-strong); }
.ctrl { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1rem; padding: 0.85rem 0; border-bottom: 1px solid var(--line); }
.ctrl-main { min-width: 0; flex: 1 1 14rem; }
.settings-desc { margin-top: 0.75rem; }

.draft-note { margin-top: 0.75rem; padding: 0.6rem 0.9rem; border-radius: var(--radius); background: var(--amber-bg); color: var(--amber-ink); border: 1px solid var(--amber-line); font-weight: 700; font-size: 0.9rem; }
.foot-link { display: inline-flex; align-items: center; min-height: 2.75rem; margin-top: 0.5rem; color: var(--ink-2); font-size: 0.875rem; }

/* ---------- نوافذ وتنبيهات ---------- */

.dialog { border: 0; border-radius: 12px; padding: 0; width: min(38rem, calc(100vw - 2rem)); max-height: 90vh; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(5, 10, 20, 0.45); }
.dialog::backdrop { background: rgba(8, 14, 26, 0.6); }
.dialog-form { padding: 1.25rem 1.25rem 1rem; display: grid; gap: 1rem; max-height: 90vh; overflow: auto; }
.dialog-title { font-size: 1.2rem; font-weight: 800; }
.dialog.danger .dialog-title { color: var(--danger); }
.dialog-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: flex-start; }

.toasts { position: fixed; inset-inline: 0; bottom: calc(var(--nav-h) + 0.6rem + env(safe-area-inset-bottom)); display: grid; justify-items: center; gap: 0.5rem; pointer-events: none; z-index: 100; padding-inline: 1rem; }
.toast { background: var(--btn-bg); color: var(--btn-fg); padding: 0.65rem 1.1rem; border-radius: var(--radius); font-weight: 700; font-size: 0.9375rem; box-shadow: 0 6px 24px rgba(5, 10, 20, 0.3); max-width: 32rem; }
.toast-error { background: var(--danger); color: var(--danger-fg); }

@media (max-width: 40rem) {
  .main { padding-top: 1.5rem; }
  .game-admin, .game-more-body { grid-template-columns: 1fr; }
  .inline-form { grid-template-columns: 1fr; }
  .table .c-opt { display: none; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1rem; }
  .fact, .fact:first-child { padding-inline: 0; border-inline-start: 0; }
  .tab { padding-inline: 0.7rem; }
  .copy-row { flex-wrap: wrap; }
  .row { flex-direction: column; align-items: stretch; }
  .req-row .req-main { flex: 0 0 auto; } /* في العمود يصير flex-basis ارتفاعًا: بلا هذا يظهر فراغ كبير في كل طلب */
  .section-head + .hint { margin-top: -0.25rem; margin-bottom: 0.9rem; }
  .stat-card .stat-n { font-size: 1.25rem; }
  .next-step { padding: 1rem; }
  .next-step .btn, .ctrl .btn { width: 100%; }
  .admin-head .row-actions { width: 100%; }
  .admin-head .row-actions .btn { flex: 1 1 auto; }
}

@media (max-width: 24rem) {
  .tabs .tab { padding-inline: 0.5rem; } /* 360px: تتسع التبويبات الأربعة دون قصّ آخرها */
}

@media (pointer: coarse) {
  .btn-small { min-height: 2.75rem; }
  .pill { min-height: 2.75rem; }
}

@media (prefers-reduced-motion: no-preference) {
  .btn, .t-row, .nav-link, .pill { transition: background-color 0.12s ease, border-color 0.12s ease; }
}


/* ---------- الملفات الخاصة وحساب اللاعب ---------- */

.file-list { border-top: 1px solid var(--line-strong); }
.file-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.9rem 0.5rem; border-bottom: 1px solid var(--line); }
.file-main { min-width: 0; flex: 1; }
.file-name { font-weight: 800; overflow-wrap: anywhere; unicode-bidi: plaintext; }
.login .form + .hint { margin-top: 1.25rem; }
.file-msg { margin-top: 0.25rem; color: var(--ink-2); font-size: 0.9375rem; overflow-wrap: anywhere; }
.pick-list { max-height: 14rem; overflow-y: auto; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); padding: 0.25rem 0.75rem; }
.pick-list li[hidden] { display: none; }
.title.small { font-size: 1.25rem; }
@media (max-width: 480px) {
  .file-row { flex-direction: column; align-items: stretch; }
  .file-row .btn { width: 100%; }
}

/* ---------- طلبات التسجيل (لوحة المنظّم): اسم + Chess.com + هاتف + بطولة + رمز ---------- */
.req-main { flex-direction: column; align-items: flex-start; gap: 0.35rem; flex: 1 1 18rem; }
.req-top { display: flex; flex-wrap: wrap; align-items: center; gap: 0.1rem 0.9rem; }
.req-name { font-size: 1.05rem; }
.req-meta { display: flex; flex-wrap: wrap; gap: 0.35rem 1.25rem; color: var(--ink-2); font-size: 0.875rem; }
.req-item { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.5rem; }
.req-item .k { color: var(--ink-2); font-weight: 600; }
.req-item .k::after { content: ':'; }
.req-phone { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; unicode-bidi: isolate; }
.req-code { font-size: 0.8125rem; }
.player-phone { unicode-bidi: isolate; }
.t-date { font-weight: 600; color: var(--ink); }

/* ---------- شارة المنظّم (تظهر له وحده بعد الدخول) ---------- */
.role-badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.75rem; border-radius: 999px; background: var(--amber-bg); color: var(--amber-ink); border: 1px solid var(--amber-ink); font-weight: 800; font-size: 0.875rem; white-space: nowrap; }
.role-badge[hidden] { display: none; }
.home-group + .home-group { margin-top: 1.75rem; }
.group-title { font-size: 1.15rem; margin: 0 0 0.25rem; }
@media (max-width: 30rem) {
  .role-badge { font-size: 0.8125rem; padding-inline: 0.6rem; }
  .nav-link { padding-inline: 0.55rem; }
}


/* ============================================================
   اللعب الأونلاين: اللوح، صفحة الترابيزة، لوحة الترابيزات المباشرة
   مقاس المربع: 48px على الموبايل (يصغر قليلًا فقط في الشاشات الأضيق من 392px كي لا يخرج اللوح من الشاشة) و64px على الكمبيوتر.
   ============================================================ */

:root { --sq: clamp(36px, calc((100vw - 4px) / 8), 48px); --wood-line: #6b4a30; }
@media (min-width: 56rem) { :root { --sq: 64px; } }

/* صفحات اللوح واللايف أعرض من باقي الموقع. على الموبايل يملأ اللوح عرض الشاشة (48px للمربع حيث تتسع الشاشة) */
.main:has(> .play-page), .main:has(> .live-page) { max-width: 72rem; }
@media (max-width: 40rem) {
  .main:has(> .play-page) { padding-inline: 0; }
  .main:has(> .live-page) { padding-inline: 0.5rem; }
  .play-head, .play-side { padding-inline: 0.5rem; }
}

/* قطع ستونتون (css/pieces.css): تملأ الخانة كلها */
.pc { display: block; background-size: 100% 100%; background-repeat: no-repeat; background-position: center; }
.sq > .pc, .msq > .pc { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

.board-wrap { position: relative; width: max-content; max-width: 100%; margin-inline: auto; }
.board {
  display: grid; grid-template-columns: repeat(8, var(--sq)); grid-template-rows: repeat(8, var(--sq));
  direction: ltr; border: 2px solid var(--wood-line); border-radius: 6px; overflow: hidden;
  box-shadow: 0 8px 28px rgba(2, 6, 23, 0.55); touch-action: none; user-select: none; -webkit-user-select: none;
}
.sq { position: relative; width: var(--sq); height: var(--sq); padding: 0; margin: 0; border: 0; border-radius: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.sq.light { background: var(--sq-light); }
.sq.dark { background: var(--sq-dark); }
.sq:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; border-radius: 0; z-index: 3; }
.sq::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.last::before { background: rgba(255, 221, 51, 0.45); }
.sq.sel::before { background: rgba(34, 197, 94, 0.55); }
.sq.in-check::before { background: radial-gradient(circle, rgba(239, 68, 68, 0.95) 0%, rgba(239, 68, 68, 0.55) 45%, rgba(239, 68, 68, 0) 72%); }
.sq.target::after { content: ""; position: absolute; inset: 34%; border-radius: 50%; background: rgba(15, 23, 42, 0.32); pointer-events: none; z-index: 2; }
.sq.target-capture::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: calc(var(--sq) * 0.09) solid rgba(15, 23, 42, 0.32); pointer-events: none; z-index: 2; }
.coord { position: absolute; z-index: 2; font-size: 0.625rem; font-weight: 800; line-height: 1; pointer-events: none; }
.coord.rank { top: 3px; left: 3px; }
.coord.file { bottom: 2px; right: 3px; }
.sq.light .coord { color: var(--sq-dark); }
.sq.dark .coord { color: var(--sq-light); }
.pc.dragging { opacity: 0.3; }
.pc.ghost { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.55)); }

.promo { position: absolute; inset-inline: 0; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; justify-content: center; gap: 0.4rem; padding: 0.6rem; background: rgba(15, 23, 42, 0.96); border: 2px solid var(--accent); border-radius: 12px; }
.promo-btn { position: relative; width: var(--sq); height: var(--sq); padding: 0; background: var(--sq-light); border: 2px solid var(--wood-line); border-radius: 8px; cursor: pointer; }
.promo-btn:hover, .promo-btn:focus-visible { border-color: var(--accent); }
.promo-btn .pc { position: absolute; inset: 0; }

/* ---------- صفحة الترابيزة ---------- */
.play-head { display: grid; gap: 0.35rem; margin-bottom: 0.75rem; }
.play-title { font-size: clamp(1.4rem, 4.5vw, 2rem); font-weight: 800; line-height: 1.3; }
.play-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.play-grid { display: grid; gap: 1rem; }
@media (min-width: 56rem) { .play-grid { grid-template-columns: auto minmax(20rem, 1fr); align-items: start; gap: 1.5rem; } }
.play-board { display: grid; gap: 0.5rem; justify-items: center; align-content: start; }
.play-board .pstrip { width: calc(var(--sq) * 8 + 4px); max-width: 100%; }
.play-side { display: grid; gap: 0.75rem; align-content: start; min-width: 0; }

.pstrip { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.35rem 0.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.pstrip.is-turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ps-id { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.ps-name { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-color, .ps-extra { color: var(--ink-2); font-size: 0.8125rem; white-space: nowrap; }
.dot { flex: none; width: 0.65rem; height: 0.65rem; border-radius: 50%; background: var(--line-strong); }
.dot.on { background: var(--accent); }
.dot.off { background: var(--danger); }

.clock { display: inline-block; min-width: 5.5rem; padding: 0.1rem 0.7rem; text-align: center; font-size: 1.5rem; font-weight: 800; line-height: 1.5; font-variant-numeric: tabular-nums; background: #0b1220; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; }
.clock.running { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.clock.low { color: #fca5a5; border-color: var(--danger); }
.clock.running.low { background: var(--danger); color: var(--danger-fg); border-color: var(--danger); }

.banner { padding: 0.7rem 1rem; font-size: 1.15rem; font-weight: 800; line-height: 1.5; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.banner[data-kind="turn"] { border-color: var(--accent); background: #0b1e45; color: #cfe0ff; }
.banner[data-kind="win"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.banner[data-kind="lose"] { background: #3b1414; border-color: var(--danger); color: #fecaca; }
.banner[data-kind="draw"] { background: var(--silver-bg); }
.banner[data-kind="warn"], .banner-warn { background: var(--amber-bg); border-color: var(--amber-line); color: var(--amber-ink); }
.banner-sub { color: var(--ink-2); font-size: 0.9375rem; min-height: 1.4em; }
.banner-sub:empty { display: none; }

.controls { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.btn-big { min-height: 3.25rem; padding-inline: 1.6rem; font-size: 1.1rem; }
.btn-danger-soft { border-color: var(--danger); color: var(--danger); }
.btn-live { background: var(--live); border-color: var(--live); color: var(--live-ink); gap: 0.5rem; }
.btn-live:hover { border-color: #fff; }
.btn-primary:hover { border-color: #fff; }

.moves { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0.25rem 0.75rem; }
.moves summary { cursor: pointer; font-weight: 800; padding: 0.55rem 0; }
.movelist { max-height: 13rem; overflow: auto; display: grid; gap: 0.1rem; padding-bottom: 0.5rem; }
.movelist li { display: grid; grid-template-columns: 2.4rem 1fr 1fr; gap: 0.5rem; font-variant-numeric: tabular-nums; }
.movelist .mn { color: var(--ink-2); }
.movelist .mv { font-weight: 700; }

.arbiter { background: var(--surface); border: 1px solid var(--amber-line); border-radius: 10px; padding: 0.75rem 0.9rem; display: grid; gap: 0.5rem; }
.arbiter h2 { font-size: 1.05rem; font-weight: 800; }
.arb-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.flag-line { font-weight: 700; }

/* ---------- لوحة الترابيزات المباشرة ---------- */
.live-head { display: grid; gap: 0.3rem; margin-bottom: 0.75rem; }
.live-head h1 { font-size: clamp(1.5rem, 5vw, 2.1rem); font-weight: 800; line-height: 1.3; }
.live-counters { color: var(--ink-2); font-weight: 700; margin-bottom: 0.75rem; }
.auto-line { color: var(--ok-ink); font-size: 0.875rem; font-weight: 700; margin-bottom: 0.75rem; }
.live-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
.live-bar .hint { flex: 1 1 100%; }
.live-grid { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }

.tcard { display: grid; gap: 0.6rem; padding: 0.8rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.tcard[data-st="play"] { border-color: rgba(239, 68, 68, 0.65); }
.tcard.is-susp { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.tc-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.tc-no { font-size: 1.05rem; font-weight: 800; }
.chip-state.st-play { background: var(--live); color: var(--live-ink); }
.chip-state.st-wait { background: var(--line); color: var(--ink); }
.chip-state.st-pause, .chip-state.st-disc { background: var(--amber-bg); color: var(--amber-ink); }
.chip-state.st-done { background: var(--ok-bg); color: var(--ok-ink); }
.chip-state.st-play::before { content: ""; width: 0.5rem; height: 0.5rem; margin-inline-end: 0.4rem; border-radius: 50%; background: #fff; }
.live-dot { flex: none; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #fff; }
.tc-body { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 0.7rem; align-items: center; }
.mini { display: grid; grid-template-columns: repeat(8, 1fr); width: 8rem; aspect-ratio: 1; border: 2px solid var(--wood-line); border-radius: 6px; overflow: hidden; direction: ltr; }
.msq { position: relative; aspect-ratio: 1; }
.msq.light { background: var(--sq-light); }
.msq.dark { background: var(--sq-dark); }
.msq.last::before { content: ""; position: absolute; inset: 0; background: rgba(255, 221, 51, 0.5); }
.tc-side { display: grid; gap: 0.4rem; min-width: 0; }
.tc-player { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.4rem; }
.tc-player .sw { font-size: 1.1rem; line-height: 1; }
.tn-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.tcard .clock { min-width: 4.4rem; font-size: 1.05rem; padding-inline: 0.45rem; }
.tc-mid { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.tscore { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.chip-flag.flag-clean { background: var(--ok-bg); color: var(--ok-ink); }
.chip-flag.flag-susp { background: #7f1d1d; color: #fecaca; }
.chip-flag.flag-pending { background: var(--line); color: var(--ink-2); }
.tnote { color: var(--ink-2); font-size: 0.875rem; font-weight: 600; }
.tc-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.tc-actions .btn { flex: 1 1 auto; }
@media (max-width: 24rem) { .tc-body { grid-template-columns: 6.5rem minmax(0, 1fr); } .mini { width: 6.5rem; } }

/* ---------- صفحة اللاعب وتسجيل الأونلاين ---------- */
.my-color { margin-bottom: 0.5rem; }
.color-chip { display: inline-flex; align-items: center; padding: 0.35rem 1rem; border-radius: 999px; font-weight: 800; font-size: 1.1rem; border: 2px solid transparent; }
.color-chip.is-white { background: #f8fafc; color: #0f172a; }
.color-chip.is-black { background: #020617; color: #f8fafc; border-color: #64748b; }
.notice-line { padding: 0.6rem 0.9rem; margin-bottom: 0.9rem; border-radius: var(--radius); background: var(--amber-bg); color: var(--amber-ink); font-weight: 700; }
.notice-line .link { color: inherit; text-decoration: underline; }
.table-link { margin-inline-start: auto; }
.foot-actions { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; }
.foot-btn { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

@media (prefers-reduced-motion: no-preference) {
  .chip-state.st-play::before, .live-dot { animation: ct-pulse 1.4s ease-in-out infinite; }
  @keyframes ct-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .clock { transition: background-color 0.15s ease; }
}
.chip-live { background: var(--live); color: var(--live-ink); gap: 0.4rem; }

.copyright { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--line); text-align: center; font-weight: 600; }


/* ============================================================
   V2 — الشكل الجديد: بطل الصفحة، الأزرار، الكروت، شريط التنقل السفلي، الحسابات والأصدقاء
   ============================================================ */

.page-title { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 800; line-height: 1.3; margin-bottom: 1rem; }
.sec-title { display: inline-block; font-size: 1.15rem; font-weight: 700; margin: 1.6rem 0 0.8rem; padding-bottom: 0.3rem; border-bottom: 2px solid var(--ink); }

/* ---------- شريط التنقل السفلي ---------- */
.bnav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 0.4rem 0.5rem calc(0.4rem + env(safe-area-inset-bottom));
  background: rgba(6, 6, 8, 0.94); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.bn-item { position: relative; display: grid; justify-items: center; align-content: center; gap: 0.15rem; min-height: 3.6rem; color: var(--ink-2); text-decoration: none; font-size: 0.8125rem; font-weight: 600; }
.bn-ic { position: relative; display: inline-grid; }
.bn-item[data-nav="tournaments"] .bn-ic { color: var(--gold); }
.bn-item[aria-current="page"] { color: #3b82f6; }
.bn-item[aria-current="page"][data-nav="live"], .bn-item[aria-current="page"][data-nav="profile"], .bn-item[aria-current="page"][data-nav="tournaments"] { color: #fff; }
.bn-item[aria-current="page"]::after { content: ""; position: absolute; bottom: 0.1rem; width: 2.6rem; height: 3px; border-radius: 3px; background: #2563eb; box-shadow: 0 0 10px #2563eb; }
.bn-dot { position: absolute; top: -2px; inset-inline-end: -4px; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: #ef4444; border: 2px solid #060608; }
body[data-route="table"] .bnav, body[data-route="challenge"] .bnav { display: none; }
body[data-route="table"] .foot, body[data-route="challenge"] .foot { padding-bottom: 2rem; }
@media (min-width: 52rem) { .bnav { inset-inline: 50%; transform: translateX(-50%); width: 36rem; bottom: 0.75rem; border: 1px solid var(--line); border-radius: 20px; } html[dir="rtl"] .bnav { transform: translateX(50%); } }

/* ---------- الصفحة الرئيسية: البطل + الأزرار ---------- */
.main:has(> .home) { padding-top: 0; }
.hero { position: relative; margin-inline: -1rem; padding: 0; }
.hero-art {
  height: clamp(17rem, 78vw, 27rem);
  background: linear-gradient(#000 0, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.85) 88%, #000 100%), url('img/hero.webp') 50% 30% / cover no-repeat;
}
.hero.guest .hero-art { height: clamp(22rem, 100vw, 31rem); }
.hero-body { position: relative; z-index: 1; display: grid; gap: 0.8rem; padding: 0 1rem; margin-top: -3.6rem; }
.hero .lede { color: #d5dbe6; font-size: 0.95rem; text-align: center; max-width: none; text-shadow: 0 1px 8px #000; }
.cta-stack { display: grid; gap: 0.65rem; }
.cta-stack .hint { text-align: center; }
.btn-pill { border-radius: 999px; min-height: 3.4rem; font-size: 1.05rem; }
.btn-big { min-height: 3.4rem; }
.btn-light { background: #fff; border-color: #fff; color: #000; }
.btn-light:hover { border-color: #fff; background: #e8ecf3; }
.btn-primary:hover { border-color: #93c5fd; }
.play-pill { display: flex; align-items: center; justify-content: center; gap: 0.9rem; min-height: 4.2rem; padding: 0.5rem 1.5rem; border-radius: 999px; background: #fff; color: #000; text-decoration: none; }
.play-pill .pp-text { display: grid; line-height: 1.35; }
.play-pill strong { font-size: 1.35rem; font-weight: 700; }
.play-pill small { font-size: 0.9rem; color: #333; }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.75rem; }
.q-card { position: relative; display: flex; align-items: center; gap: 0.7rem; min-height: 4.6rem; padding: 0.9rem 0.9rem; border-radius: 18px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); text-decoration: none; }
.q-card:hover { border-color: var(--ink-2); }
.q-ic { display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 10px; background: #0f172a; color: var(--ink); flex: none; }
.q-ic.gold { color: var(--gold); }
.q-text { display: grid; line-height: 1.35; min-width: 0; }
.q-text strong { font-size: 1rem; font-weight: 700; }
.q-text small { color: var(--ink-2); font-size: 0.8rem; }
.q-dot { position: absolute; top: 0.6rem; inset-inline-end: 0.7rem; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); }
.free-badge { position: absolute; top: -0.6rem; inset-inline-end: 0.7rem; padding: 0.05rem 0.7rem; border-radius: 999px; background: #04210f; border: 1px solid var(--live); color: #86efac; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; }
@media (max-width: 26rem) { .quick { grid-template-columns: 1fr; } .q-card { min-height: 4rem; } }
@media (prefers-reduced-motion: no-preference) { .q-dot { animation: pulse 1.8s ease-in-out infinite; } @keyframes pulse { 50% { opacity: 0.35; } } }

.champ-slot, .note-slot { margin-top: 1rem; }
.champ-link { display: block; text-decoration: none; color: inherit; }
.champion { display: flex; align-items: center; gap: 1rem; padding: 1rem; border-radius: 18px; background: linear-gradient(135deg, #3b2f0a, #1e293b); border: 1px solid #8a6a22; }
.trophy-gold { display: inline-grid; place-items: center; color: var(--gold); flex: none; }
.champ-text { display: grid; line-height: 1.4; }
.champ-name { font-size: 1.2rem; font-weight: 800; }
.who-row { display: inline-flex; align-items: center; gap: 0.5rem; }

/* ---------- الصور الشخصية ---------- */
.avatar { display: inline-block; border-radius: 50%; object-fit: cover; background: #334155; flex: none; border: 2px solid #3b4658; }
.avatar-sm { width: 1.9rem; height: 1.9rem; border-width: 1px; }
.avatar-md { width: 2.8rem; height: 2.8rem; }
.avatar-lg { width: 3.6rem; height: 3.6rem; border-color: #e5e7eb; }
.avatar-xl { width: 4.6rem; height: 4.6rem; border-color: #e5e7eb; }
.avatar-ph { display: inline-grid; place-items: center; color: var(--ink); font-weight: 800; }
.avatar-sm.avatar-ph { font-size: 0.9rem; } .avatar-md.avatar-ph { font-size: 1.2rem; } .avatar-lg.avatar-ph { font-size: 1.5rem; } .avatar-xl.avatar-ph { font-size: 1.9rem; }
.photo-field .photo-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.photo-input { max-width: 100%; min-width: 0; width: 100%; }
.photo-prev { display: inline-grid; }
.linkish { background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; border-radius: 50%; }

/* ---------- بطاقة إحصائيات اللاعب ---------- */
.pcard { display: grid; gap: 0.9rem; padding: 1.1rem; border-radius: 22px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); text-decoration: none; }
a.pcard:hover { border-color: var(--ink-2); }
.sc-top { display: flex; align-items: center; gap: 1rem; padding-bottom: 0.9rem; border-bottom: 1px solid var(--line); }
.sc-id { display: grid; line-height: 1.4; flex: 1; min-width: 0; }
.sc-k { color: var(--ink-2); font-size: 0.85rem; }
.sc-name { font-size: 1rem; font-weight: 700; overflow-wrap: anywhere; }
.sc-rating { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 2.4rem; font-weight: 800; line-height: 1.1; direction: ltr; justify-self: start; }
.sc-knight { font-size: 1.7rem; font-weight: 400; color: var(--ink-2); }
.sc-go { color: var(--ink-2); flex: none; }
html[dir="rtl"] .sc-go { transform: scaleX(-1); }
.sc-wld { display: grid; grid-template-columns: repeat(3, 1fr); }
.sc-cell { display: grid; justify-items: center; line-height: 1.3; padding-inline: 0.3rem; }
.sc-cell + .sc-cell { border-inline-start: 1px solid var(--line); }
.sc-n { font-size: 2.1rem; font-weight: 800; }
.sc-cell.w .sc-n { color: var(--win); } .sc-cell.l .sc-n { color: var(--danger); } .sc-cell.d .sc-n { color: var(--ink); }
.sc-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem; padding-top: 0.8rem; border-top: 1px solid var(--line); color: var(--ink-2); }
.sc-played { display: inline-flex; align-items: center; gap: 0.5rem; }
.sc-played strong { color: var(--ink); font-size: 1.4rem; }
.sc-places { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.place { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.8rem; border-radius: 999px; background: #0f1623; border: 1px solid var(--line-strong); color: var(--ink); font-weight: 700; font-size: 0.9rem; }
.place.gold svg { color: var(--gold); } .place.silver svg { color: var(--silver); } .place.bronze svg { color: var(--bronze); }
.tap-hint { margin-top: 1rem; text-align: center; color: var(--ink-2); font-size: 0.9rem; }
.face-row { display: flex; justify-content: center; gap: 0.9rem; margin-top: 0.7rem; flex-wrap: wrap; }
.face { position: relative; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 50%; }
.online-dot { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 50%; background: #64748b; border: 2px solid #000; vertical-align: middle; }
.online-dot.on { background: var(--live); }
.face .online-dot { position: absolute; bottom: 2px; inset-inline-end: 2px; width: 0.9rem; height: 0.9rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 0.6rem; }
.stats .stat { display: grid; padding: 0.7rem 0.9rem; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.stats dd { font-size: 1.5rem; font-weight: 800; order: 1; }
.stats dt { color: var(--ink-2); font-size: 0.82rem; order: 2; }
.stat-gold dd { color: var(--gold); } .stat-silver dd { color: var(--silver); } .stat-bronze dd { color: var(--bronze); } .stat-rating dd { color: #fff; }
.pp { display: grid; gap: 1rem; }
.pp-id { display: flex; align-items: center; gap: 1rem; }
.pp-name { font-size: 1.2rem; font-weight: 800; }

/* ---------- قائمة البطولات ---------- */
.t-list { border-top: 0; display: grid; gap: 0.7rem; }
.t-row { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem; }
.t-row:hover { border-color: var(--line-strong); background: var(--surface); }
.t-row.is-new { border-color: #2563eb; box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.35); }
.t-main { display: grid; gap: 0.25rem; min-width: 0; }
.new-badge { display: inline-block; margin-inline-end: 0.55rem; padding: 0.05rem 0.55rem; border-radius: 6px; background: #2563eb; color: #fff; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; vertical-align: middle; }
.t-count { color: #93c5fd; font-weight: 600; font-size: 0.9rem; }
.countdown { display: block; font-variant-numeric: tabular-nums; }
.home-list { margin-top: 0.5rem; }

/* ---------- إشعارات ---------- */
.notes { display: grid; gap: 0.6rem; }
.note-list { display: grid; gap: 0.6rem; }
.note { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; padding: 0.85rem 1rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-strong); }
.note-match { border-color: #2563eb; background: #0b1e45; }
.note-title { font-weight: 800; }

/* ---------- الحسابات والنماذج ---------- */
.me-head { display: grid; gap: 0.8rem; }
.me-id { display: flex; align-items: center; gap: 1rem; }
.me-text { display: grid; line-height: 1.4; }
.org-profile { padding: 1rem; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.welcome { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.welcome-name { font-weight: 800; font-size: 1.1rem; }
.radio-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.radio-pill { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem; min-height: 2.75rem; padding: 0.3rem 1rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--ink); font-weight: 700; cursor: pointer; }
.radio-pill small { color: var(--ink-2); font-weight: 500; font-size: 0.72rem; }
.radio-pill.on, .radio-pill[aria-checked="true"] { border-color: #3b82f6; background: #0b1e45; box-shadow: 0 0 0 1px #3b82f6; }
.tc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.2rem, 1fr)); gap: 0.5rem; margin-top: 0.8rem; }
.tc-grid .radio-pill { border-radius: 14px; }
.pw-list { display: grid; gap: 0.2rem; margin-top: 0.4rem; font-size: 0.875rem; color: var(--ink-2); }
.pw-item.ok, .pw-item[data-ok="true"] { color: var(--ok-ink); }
.pw-mark { display: inline-block; width: 1.1em; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.wa-helper { display: grid; gap: 0.6rem; padding: 1rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.wa-preview { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; min-width: 0; padding: 0.8rem; border-radius: 10px; background: #0b1f16; border: 1px solid #14532d; color: #d1fae5; font-family: inherit; line-height: 1.7; }
.crumb-link { text-decoration: none; }
.round-block { margin-top: 1rem; }
.timers { color: #93c5fd; font-weight: 600; }
.next-line { font-size: 1.05rem; }
.big-n { font-size: 2rem; font-weight: 800; }
.choice { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.opp-btn { display: inline-flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.9rem 0.5rem 0.6rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); cursor: pointer; font-weight: 700; }
.who { color: var(--ink-2); }
.profile-slot { margin-top: 0.5rem; }

/* ---------- الأصدقاء والتحدّي ---------- */
.f-invites:empty { display: none; }
.f-list { display: grid; gap: 0.6rem; }
.f-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0.9rem; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.f-main { flex: 1; min-width: 0; }
.f-name { font-weight: 800; }
.ch-table { display: grid; gap: 0.8rem; }

/* بطاقة تثبيت التطبيق */
.install-slot:empty { display: none; }
.install-card { display: flex; align-items: center; gap: .85rem; width: 100%; margin-block-start: .75rem; padding: .85rem 1rem; border: 1px dashed var(--line-strong); border-radius: 16px; background: var(--surface); color: inherit; font: inherit; text-align: start; cursor: pointer; }
.install-card.ios { cursor: default; }
.install-card:hover:not(.ios) { border-color: var(--accent); }
.install-card .q-text { display: grid; gap: .1rem; }
.install-card .q-text small { color: var(--ink-2); }

/* هيدر ضيّق (جوال): نضغط الشعار والأدوات كي لا تعرّض الصفحة أفقيًا، حتى مع شارة المنظّم */
@media (max-width: 30rem) {
  .top { gap: 0.4rem; padding-inline: 0.75rem; }
  .brand { gap: 0.5rem; }
  .brand-en { font-size: 1.4rem; }
  .brand-ar { font-size: 1.15rem; }
  .top-tools { gap: 0.25rem; min-width: 0; }
  .lang-btn { min-width: 2.3rem; padding: 0 0.5rem; font-size: 0.9rem; }
  .icon-btn { width: 2.4rem; }
  .role-badge { font-size: 0.75rem; padding: 0.15rem 0.5rem; }
}
@media (max-width: 26rem) {
  .top:has(.role-badge:not([hidden])) .brand-ar, .top:has(.role-badge:not([hidden])) .brand-sep { display: none; }
}

const SHARE_META = ['owner', 'recipients', 'name', 'mime', 'size', 'message', 'createdAt']; // بلا محتوى الملف

const FRIENDLY_RATED_PER_DAY = 2;

function createRemoteStore({ projectId, apiKey, databaseURL = '' }) {
  const auth = createAuth({ apiKey });
  const fs = createFirestore({ projectId, apiKey, getToken: auth.getToken });
  // القاعدة اللحظية (اللعب الأونلاين): عنوانها من config.js أو الافتراضي لمشروع أمريكا. عنوان غير صالح = اللعب الأونلاين معطّل فقط.
  let rtdb = null; let rtdbError = null;
  try { rtdb = createRtdb({ databaseURL, projectId, getToken: auth.getToken }); } catch (e) { rtdbError = e; }
  const { write } = fs;
  const profileCache = new Map(); // uid -> الملف العام (ذاكرة الجلسة فقط)

  const T = (tid) => `tournaments/${tid}`;
  const bump = (tid, patch = {}) => write.patch(T(tid), patch, { increments: ['rev'] });

  const needMe = () => {
    const me = auth.current();
    if (!me) throw new Error('سجّل الدخول أولًا.');
    return me;
  };

  return {
    mode: 'remote',
    auth,
    rtdb,
    rtdbError,

    async isAdmin() {
      const me = auth.current();
      if (!me) return false;
      try {
        return !!(await fs.getDoc(`admins/${me.uid}`));
      } catch (e) {
        if (e.denied) return false;
        throw e;
      }
    },

    // ----- الحسابات -----
    // الدور لا يُخزَّن عند العميل ولا يُختار: المنظّم = مستند في admins، واللاعب/المتفرج = مستند في users.
    // النتيجة: { role: 'organizer' | 'competitor' | 'spectator' | 'none' | null (لا جلسة), uid, profile }
    // profile: الملف العام + (لصاحبه فقط) gov و phone. للمنظّم: { name, photo } من site/organizer.
    async getAccount() {
      const me = auth.current();
      if (!me) return { role: null, uid: '', profile: null };
      if (await this.isAdmin()) {
        const org = await this.getOrganizerProfile();
        return { role: 'organizer', uid: me.uid, profile: org };
      }
      try {
        const [u, p] = await Promise.all([fs.getDoc(`users/${me.uid}`), fs.getDoc(`profiles/${me.uid}`)]);
        if (!u || !p) return { role: 'none', uid: me.uid, profile: null };
        const prof = toProfile(p);
        profileCache.set(me.uid, prof);
        return { role: u.role === 'spectator' ? 'spectator' : 'competitor', uid: me.uid, profile: { ...prof, gov: typeof u.gov === 'string' ? u.gov : '', phone: typeof u.phone === 'string' ? u.phone : '' } };
      } catch (e) {
        if (e.denied) return { role: 'none', uid: me.uid, profile: null };
        throw e;
      }
    },
    // إنشاء ملف الحساب (الخاص + العام) في كتابة ذرّية واحدة. لا نرسل أي «صلاحية» من هنا؛ القواعد تفرضها.
    async createAccountProfile({ role, name, gender, photo, gov, phone, code }) {
      const me = needMe();
      const priv = role === 'spectator' ? { role: 'spectator', code } : { role: 'competitor', gov, phone };
      await fs.commit([
        write.set(`users/${me.uid}`, priv, { mustNotExist: true, serverTime: ['createdAt'] }),
        write.set(`profiles/${me.uid}`, {
          name, photo, gender, rating: 1300, shortId: 'KASH-' + me.uid.slice(-4).toUpperCase(), wins: 0, losses: 0, draws: 0, played: 0, p1: 0, p2: 0, p3: 0,
        }, { mustNotExist: true, serverTime: ['createdAt'] }),
      ]);
    },
    // حساب جديد: بريد وكلمة مرور (يحفظهما Firebase مشفّرين؛ لا نراهما) ثم الملف. إن فشل الملف نحذف الحساب الناقص.
    async signUpAccount({ email, password, remember = false, ...profile }) {
      await auth.signUp(email, password, { remember });
      try {
        await this.createAccountProfile(profile);
      } catch (e) {
        await auth.deleteCurrentAccount();
        throw e;
      }
    },
    async resetPassword(email) { await auth.sendPasswordReset(email); },
    async updateMyProfile({ name, photo }) {
      const me = needMe();
      await fs.commit([write.patch(`profiles/${me.uid}`, { name, photo })]);
      profileCache.delete(me.uid);
    },
    // الهاتف والمحافظة (للمنظّم فقط يظهران). ترقية متفرج إلى لاعب تمر من هنا بإضافتهما.
    async becomePlayer({ gov, phone }) {
      const me = needMe();
      await fs.commit([write.patch(`users/${me.uid}`, { role: 'competitor', gov, phone })]);
    },
    async updateContact({ gov, phone }) {
      const me = needMe();
      await fs.commit([write.patch(`users/${me.uid}`, { gov, phone })]);
    },
    // الملف العام لأي حساب (للمسجَّلين فقط). مخزَّن مؤقتًا في الذاكرة؛ null إن لم يوجد أو لم تكن مسجَّلًا.
    async getProfile(uid) {
      if (!uid || !auth.current()) return null;
      if (profileCache.has(uid)) return profileCache.get(uid);
      try {
        const d = await fs.getDoc(`profiles/${uid}`);
        const v = d ? toProfile(d) : null;
        if (v) profileCache.set(uid, v);
        return v;
      } catch (e) {
        if (e.denied) return null;
        throw e;
      }
    },
    async getProfiles(uids) {
      const out = {};
      const list = [...new Set(uids.filter(Boolean))];
      for (let i = 0; i < list.length; i += 8) {
        await Promise.all(list.slice(i, i + 8).map(async (u) => { const p = await this.getProfile(u); if (p) out[u] = p; }));
      }
      return out;
    },
    invalidateProfile(uid) { profileCache.delete(uid); },
    // ملف المنظّم العام (يراه الجميع)
    async getOrganizerProfile() {
      try {
        const d = await fs.getDoc('site/organizer');
        return d ? { name: typeof d.name === 'string' ? d.name : '', photo: typeof d.photo === 'string' ? d.photo : '' } : null;
      } catch (e) {
        if (e.denied) return null;
        throw e;
      }
    },
    async saveOrganizerProfile({ name, photo }) {
      needMe();
      await fs.commit([write.set('site/organizer', { name, photo })]);
    },
    // رمز دعوة المتفرجين (المنظّم فقط)
    async getSpectatorCode() {
      const d = await fs.getDoc('site/settings');
      return d && typeof d.spectatorCode === 'string' ? d.spectatorCode : '';
    },
    async setSpectatorCode(code) {
      needMe();
      await fs.commit([write.set('site/settings', { spectatorCode: code })]);
    },
    // المنظّم: كل الحسابات (الاسم والجنس والتقييم بلا الصورة) لاختيار المستلمين وعرض المسجَّلين
    async listCompetitors() {
      needMe();
      const docs = await fs.list('', 'profiles', { select: ['name', 'gender', 'rating'] });
      return docs.map(toProfile).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    },

    // ----- الأصدقاء (خاصة بصاحبها) -----
    async listFriends() {
      const me = needMe();
      const docs = await fs.list(`users/${me.uid}`, 'friends');
      return docs.map((d) => d.id);
    },
    async addFriend(uid) {
      const me = needMe();
      if (uid === me.uid) throw new Error('مش ممكن تضيف نفسك.');
      await fs.commit([write.set(`users/${me.uid}/friends/${uid}`, {}, { serverTime: ['createdAt'] })]);
    },
    async removeFriend(uid) {
      const me = needMe();
      await fs.commit([write.remove(`users/${me.uid}/friends/${uid}`)]);
    },

    // ----- دوري الشلة (عام) -----
    async getLeagueEntries() {
      const docs = await fs.list('', 'league');
      return docs.map((d) => ({
        id: d.id, name: typeof d.name === 'string' ? d.name : '', month: typeof d.month === 'string' ? d.month : '',
        at: Number.isFinite(d.at) ? d.at : 0,
        rows: (Array.isArray(d.rows) ? d.rows : []).filter((r) => r && typeof r.uid === 'string').map((r) => ({
          uid: r.uid, name: typeof r.name === 'string' ? r.name : '', rank: Number.isFinite(r.rank) ? r.rank : 99,
        })),
      })).sort((a, b) => b.at - a.at);
    },

    // ----- الملفات الخاصة -----
    async sendShare({ recipients, name, mime, size, data, message = '' }) {
      const me = needMe();
      const id = newId(14);
      await fs.commit([
        write.set(`shares/${id}`, { owner: me.uid, recipients, name, mime, size, data, message }, {
          mustNotExist: true, serverTime: ['createdAt'],
        }),
      ]);
      return id;
    },
    // ما أرسله المنظّم (بلا محتوى الملف)
    async listSentShares() {
      const me = needMe();
      const docs = await fs.list('', 'shares', { where: [{ field: 'owner', value: me.uid }], select: SHARE_META });
      return docs.map(toShare).sort((a, b) => b.createdAt - a.createdAt);
    },
    // ما وصل اللاعب (بلا محتوى الملف). الاستعلام نفسه مقيّد بمعرّفه، والقواعد ترفض غيره.
    async listMyShares() {
      const me = needMe();
      const docs = await fs.list('', 'shares', {
        where: [{ field: 'recipients', op: 'ARRAY_CONTAINS', value: me.uid }], select: SHARE_META,
      });
      return docs.map(toShare).sort((a, b) => b.createdAt - a.createdAt);
    },
    async getShare(id) {
      needMe();
      const d = await fs.getDoc(`shares/${id}`);
      return d ? toShare(d) : null;
    },
    async deleteShare(id) {
      needMe();
      await fs.commit([write.remove(`shares/${id}`)]);
    },

    // ----- قراءة -----
    // الجمهور يرى المنشورة فقط (القواعد تفرض ذلك). المنظّم يطلب الكل بـ { all: true }.
    async listTournaments({ all = false } = {}) {
      const docs = await fs.list('', 'tournaments', { where: all ? [] : [{ field: 'published', value: true }] });
      return docs.map(toTournament).sort((a, b) => b.createdAt - a.createdAt);
    },
    // البطولة غير المنشورة ترفضها القواعد (403) فتبدو للزائر «غير موجودة»؛ لا نكشف أنها موجودة.
    async getTournament(tid) {
      try {
        const d = await fs.getDoc(T(tid));
        return d ? toTournament(d) : null;
      } catch (e) {
        if (e.denied) return null;
        throw e;
      }
    },
    async getPlayers(tid) {
      const docs = await fs.list(T(tid), 'players');
      return docs.map(toPlayer).sort((a, b) => a.createdAt - b.createdAt || a.name.localeCompare(b.name, 'ar'));
    },
    async getGames(tid) {
      const docs = await fs.list(T(tid), 'games');
      return docs.map(toGame).sort((a, b) => a.round - b.round || a.board - b.board);
    },

    // ----- تسجيل اللاعبين -----
    // الهوية = حسابك. القواعد ترفض الطلب إن كان التسجيل مغلقًا أو انتهى موعده أو الرمز خاطئًا أو الجنس لا يناسب البطولة.
    async register(tid, { prefColor, code }) {
      const me = needMe();
      const prof = await this.getProfile(me.uid);
      if (!prof) throw new Error('كمّل بيانات حسابك الأول.');
      await fs.commit([
        write.set(`${T(tid)}/registrations/${me.uid}`, { uid: me.uid, name: prof.name, prefColor, code }, {
          mustNotExist: true, serverTime: ['createdAt'],
        }),
      ]);
    },
    // حالة طلبي: الطلب نفسه إن بقي، وإلا null (القواعد تسمح لصاحب الطلب فقط؛ الرفض يعني «لا طلب لك»)
    async getMyRegistration(tid) {
      const me = auth.current();
      if (!me) return null;
      try {
        const d = await fs.getDoc(`${T(tid)}/registrations/${me.uid}`);
        return d ? toRegistration(d) : null;
      } catch (e) {
        if (e.denied) return null;
        throw e;
      }
    },

    // ----- المنظّم: قراءة خاصة -----
    // الطلبات مع جنس اللاعب وتقييمه (من الملف العام) وهاتفه ومحافظته (من الملف الخاص: يراها المنظّم وحده)
    async getRegistrations(tid) {
      const [docs, profiles, users] = await Promise.all([
        fs.list(T(tid), 'registrations'),
        fs.list('', 'profiles', { select: ['name', 'gender', 'rating'] }),
        fs.list('', 'users'),
      ]);
      const pm = new Map(profiles.map((d) => [d.id, d]));
      const um = new Map(users.map((d) => [d.id, d]));
      return docs.map((d) => {
        const r = toRegistration(d);
        const p = pm.get(r.uid); const u = um.get(r.uid);
        if (p) { r.gender = ['boy', 'girl'].includes(p.gender) ? p.gender : ''; r.rating = Number.isFinite(p.rating) ? p.rating : 1300; }
        if (u) { r.phone = typeof u.phone === 'string' ? u.phone : ''; r.gov = typeof u.gov === 'string' ? u.gov : ''; }
        return r;
      }).sort((a, b) => a.createdAt - b.createdAt);
    },
    // أرقام هواتف اللاعبين بحساب (للمنظّم وحده، لواتساب): { uid: phone }
    async getContacts() {
      const users = await fs.list('', 'users');
      const out = {};
      for (const d of users) if (typeof d.phone === 'string' && d.phone) out[d.id] = d.phone;
      return out;
    },
    // { مفتاح اللاعب: uid حسابه } للاعبين بحساب (المفتاح نفسه هو uid)
    async getPlayerUids(tid) {
      const docs = await fs.list(T(tid), 'players');
      const out = {};
      for (const d of docs) if (d.acct === true) out[d.id] = d.id;
      return out;
    },
    async getInviteCode(tid) {
      const d = await fs.getDoc(`${T(tid)}/private/settings`);
      return d && typeof d.inviteCode === 'string' ? d.inviteCode : '';
    },

    // ----- المنظّم: البطولات -----
    // publish: true ← تظهر فورًا للاعبين ويفتح التسجيل؛ false ← مسودة لا يراها أحد غيرك
    // رمز الدعوة إلزامي: يُنشأ تلقائيًا إن لم يُمرَّر، فلا توجد بطولة بلا رمز.
    async createTournament(data, inviteCode, { publish = false } = {}) {
      const tid = newId(10);
      inviteCode = inviteCode || newInviteCode();
      await fs.commit([
        write.set(T(tid), { ...data, status: 'registration', currentRound: 0, totalRounds: 0, playerCount: 0, rev: 0, inviteRequired: true, published: !!publish, registrationOpen: !!publish }, {
          mustNotExist: true,
          serverTime: ['createdAt'],
        }),
        write.set(`${T(tid)}/private/settings`, { inviteCode }),
      ]);
      return tid;
    },
    async updateTournament(tid, patch) {
      await fs.commit([bump(tid, patch)]);
    },
    async setInviteCode(tid, code) {
      if (!code) throw new Error('رمز الدعوة إلزامي ولا يمكن إلغاؤه. أنشئ رمزًا جديدًا بدلًا منه.');
      await fs.commit([
        write.set(`${T(tid)}/private/settings`, { inviteCode: code }),
        bump(tid, { inviteRequired: true }),
      ]);
    },
    async deleteTournament(tid) {
      // ترابيزات اللعب الأونلاين (إن وُجدت): كل ترابيزة على حدة لأن القواعد تسمح بحذفها بالاسم فقط. فشلها لا يمنع الحذف.
      if (rtdb) {
        try {
          const idx = await rtdb.get(`liveIdx/${tid}`);
          const multi = {};
          for (const id of Object.keys(idx || {})) { multi[`live/${tid}/${id}`] = null; multi[`liveIdx/${tid}/${id}`] = null; multi[`flags/${tid}/${id}`] = null; }
          if (Object.keys(multi).length) await rtdb.update(multi);
        } catch { /* ignore */ }
      }
      const [players, games, regs, priv] = await Promise.all([
        fs.list(T(tid), 'players'), fs.list(T(tid), 'games'), fs.list(T(tid), 'registrations'), fs.list(T(tid), 'private'),
      ]);
      const ops = [
        ...players.map((p) => write.remove(`${T(tid)}/players/${p.id}`)),
        ...games.map((g) => write.remove(`${T(tid)}/games/${g.id}`)),
        ...regs.map((r) => write.remove(`${T(tid)}/registrations/${r.id}`)),
        ...priv.map((d) => write.remove(`${T(tid)}/private/${d.id}`)), // الرمز السري وأرقام الهواتف
        write.remove(`${T(tid)}/private/settings`),
      ];
      await fs.commitChunked(ops);
      await fs.commit([write.remove(T(tid))]);
    },

    // ----- المنظّم: اللاعبون -----
    async approveRegistrations(tid, regs, tpatch = {}) {
      for (let i = 0; i < regs.length; i += 150) {
        const part = regs.slice(i, i + 150);
        const last = i + 150 >= regs.length;
        const ops = part.flatMap((r) => [
          // مفتاح اللاعب = uid حسابه. الجنس يُنسخ من ملفه ليظهر الترتيب المنفصل (أولاد/بنات). لا هاتف ولا صورة هنا (عام).
          write.set(`${T(tid)}/players/${r.id}`, {
            name: r.name, gender: r.gender || '', prefColor: r.prefColor, acct: true, active: true,
          }, { serverTime: ['createdAt'] }),
          write.remove(`${T(tid)}/registrations/${r.id}`),
        ]);
        if (last) ops.push(bump(tid, tpatch));
        await fs.commit(ops);
      }
    },
    async rejectRegistration(tid, key) {
      await fs.commit([write.remove(`${T(tid)}/registrations/${key}`)]);
    },
    async rejectRegistrations(tid, keys) {
      await fs.commitChunked(keys.map((key) => write.remove(`${T(tid)}/registrations/${key}`)));
    },
    // لاعب بلا حساب (يضيفه المنظّم يدويًا): بلا تقييم ولا لعب أونلاين
    async addPlayer(tid, { key, name, gender = '', prefColor = 'any' }, tpatch = {}) {
      await fs.commit([
        write.set(`${T(tid)}/players/${key}`, { name, gender, acct: false, prefColor, active: true }, {
          mustNotExist: true, serverTime: ['createdAt'],
        }),
        bump(tid, tpatch),
      ]);
    },
    async patchPlayer(tid, key, patch, tpatch = {}) {
      await fs.commit([write.patch(`${T(tid)}/players/${key}`, patch), bump(tid, tpatch)]);
    },
    async removePlayer(tid, key, tpatch = {}) {
      await fs.commit([write.remove(`${T(tid)}/players/${key}`), bump(tid, tpatch)]);
    },

    // ----- المنظّم: القرعة والنتائج -----
    // تُكتب المباريات أولًا، ثم يُحدَّث مستند البطولة (فيظهر للجمهور مكتملًا)
    async publishGames(tid, games, tpatch = {}) {
      await fs.commitChunked(games.map((g) => write.set(`${T(tid)}/games/${g.id}`, gameFields(g))));
      await fs.commit([bump(tid, tpatch)]);
    },
    async deleteGames(tid, ids, tpatch = {}) {
      await fs.commit([bump(tid, tpatch)]); // أخفِ الجولة من العرض أولًا (يرفع rev)
      await fs.commitChunked(ids.map((id) => write.remove(`${T(tid)}/games/${id}`)));
      await fs.commit([bump(tid)]);
    },
    async patchGame(tid, gid, patch) {
      await fs.commit([write.patch(`${T(tid)}/games/${gid}`, patch), bump(tid)]);
    },

    // ----- المنظّم: التقييم المحلي (+20 فوز / −10 خسارة / +5 تعادل، لبطولاتنا فقط) -----
    // تسجيل/تصحيح نتيجة مباراة وتحديث تقييم اللاعبَين (إن كان لهما حساب) في كتابة ذرّية واحدة.
    // الفرق الصافي بين النتيجة القديمة والجديدة: لا يتكرر الاحتساب عند التصحيح ولا عند إعادة المحاولة.
    async recordResult(tid, gid, patch) {
      const g = await fs.getDoc(`${T(tid)}/games/${gid}`);
      if (!g) throw new Error('المباراة غير موجودة.');
      const oldResult = ['1-0', '0-1', '1/2-1/2'].includes(g.result) ? g.result : null;
      const newResult = 'result' in patch ? (['1-0', '0-1', '1/2-1/2'].includes(patch.result) ? patch.result : null) : oldResult;
      const ops = [write.patch(`${T(tid)}/games/${gid}`, patch), bump(tid)];
      if (g.black && oldResult !== newResult) {
        const [wp, bp] = await Promise.all([fs.getDoc(`${T(tid)}/players/${g.white}`), fs.getDoc(`${T(tid)}/players/${g.black}`)]);
        const delta = resultDelta(oldResult, newResult);
        for (const [pl, d, uid] of [[wp, delta.w, g.white], [bp, delta.b, g.black]]) {
          if (!pl || pl.acct !== true || isZeroDelta(d)) continue;
          const inc = Object.entries(d).filter(([, by]) => by !== 0).map(([field, by]) => ({ field, by }));
          ops.push(write.patch(`profiles/${uid}`, {}, { increments: inc }));
          profileCache.delete(uid);
        }
      }
      await fs.commit(ops);
    },

    // ----- المنظّم: تقييم مباراة تحدٍّ بين صديقين (مرة واحدة لكل تحدٍّ) -----
    // friendly/{cid} يُنشأ بشرط عدم وجوده فيمنع الاحتساب المكرر. تقييم مباراتين فقط لكل زوج في اليوم (يمنع تبادل الفوز لرفع التقييم)،
    // وما زاد يُسجَّل بلا تقييم. يرجع { rated, dup }.

  let child = null;
  let stopped = false;

  // على الموقع الحقيقي: صفحة المنظّم لا تُعرض لأحد غير المنظّم، ولا حتى كصفحة دخول ولا برسالة «ممنوع».
  // الزائر يعود إلى واجهة اللاعبين، واللاعب إلى حسابه. (القواعد في الخادم هي الحماية الفعلية؛ هذا فقط كي لا يرى شيئًا.)
  const leave = (hash) => { location.replace(`${location.pathname}${location.search}${hash}`); };

  (async () => {
    const me = store.auth.current();
    if (!me) {
      replace(root, loginView(ctx));
      return;
    }
    let admin = false;
    try {
      admin = await store.isAdmin();
    } catch (e) {
      if (!stopped) replace(root, emptyState('تعذّر التحقق من صلاحيتك', messageFor(e),
        h('button', { class: 'btn', type: 'button', onclick: () => ctx.rerender() }, 'إعادة المحاولة')));
      return;
    }
    if (stopped) return;
    if (!admin) { leave('#/me'); return; }
    if (params.tid) {
      child = manageView(ctx, params.tid);
      replace(root, child.root);
    } else {
      replace(root, dashboardView(ctx, me));
    }
  })();

  return { root, dispose() { stopped = true; child?.dispose?.(); } };
}

function loginView(ctx) {
  const { store } = ctx;
  // منظّم واحد فقط: لا إنشاء حساب منظّم من الموقع أبدًا (حسابه من لوحة Firebase + مستند admins). هنا دخول فقط.
  // «حفظ البريد/كلمة المرور»: خصائص autocomplete ليحفظها مدير كلمات المرور في متصفحك (كلمة المرور لا تُخزَّن في الموقع إطلاقًا).
  // نتذكّر البريد فقط (لا كلمة المرور) في هذا الجهاز إن اخترت ذلك.
  let savedEmail = '';
  try { savedEmail = localStorage.getItem('ct_org_email') || ''; } catch { /* ignore */ }
  const email = h('input', {
    class: 'input ltr', id: 'adm-email', name: 'username', type: 'email', autocomplete: 'username', required: true, autocapitalize: 'none', spellcheck: 'false', value: savedEmail,
  });
  const password = h('input', {
    class: 'input ltr', id: 'adm-pass', name: 'password', type: 'password', autocomplete: 'current-password', required: true,
  });
  const showPass = h('input', { type: 'checkbox', id: 'adm-show', onchange: (e) => { password.type = e.target.checked ? 'text' : 'password'; } });
  const rememberEmail = h('input', { type: 'checkbox', id: 'adm-remember', checked: !!savedEmail });
  const status = h('p', { class: 'field-error', role: 'alert' });
  const idleLabel = 'دخول';
  const submit = h('button', { class: 'btn btn-primary btn-wide', type: 'submit' }, idleLabel);
  let failures = 0;

  const form = h('form', {
    class: 'form narrow',
    novalidate: true,
    onsubmit: async (e) => {
      e.preventDefault();
      status.textContent = '';
      if (!email.value.trim() || !password.value) { status.textContent = 'اكتب البريد وكلمة المرور.'; return; }
      submit.disabled = true;
      try {
        // جلسة المنظّم لا تُحفَظ أبدًا بعد إغلاق التبويب (remember=false دائمًا)
        await store.auth.signIn(email.value.trim(), password.value, { remember: false });
        try {
          if (rememberEmail.checked) localStorage.setItem('ct_org_email', email.value.trim()); else localStorage.removeItem('ct_org_email');
        } catch { /* ignore */ }
        password.value = '';
      } catch (err) {
        failures += 1;
        status.textContent = err.message;
        password.value = '';
        if (failures >= 5) {
          // تأخير شكلي؛ الحماية الفعلية من Firebase نفسها
          let left = 30;
          const tick = setInterval(() => {
            left -= 1;
            submit.textContent = left > 0 ? `انتظر ${left} ثانية` : idleLabel;
            if (left <= 0) { clearInterval(tick); submit.disabled = false; failures = 0; }
          }, 1000);
          return;
        }
        submit.disabled = false;
      }
    },
  },
  h('div', { class: 'field' }, h('label', { class: 'label', for: 'adm-email' }, 'البريد الإلكتروني'), email),
  h('div', { class: 'field' }, h('label', { class: 'label', for: 'adm-pass' }, 'كلمة المرور'), password,
    h('label', { class: 'check small' }, showPass, h('span', null, 'إظهار كلمة المرور'))),
  h('label', { class: 'check small' }, rememberEmail, h('span', null, 'تذكّر بريدي على هذا الجهاز')),
  status,
  submit);

  return h('section', { class: 'section login' },
    h('h1', { class: 'title' }, 'دخول المنظّم'),
    form,
    h('p', { class: 'hint' }, h('a', { href: '#/' }, 'رجوع للرئيسية')));
}
